minimumReleaseAge: 4320
savePrefix: ''
strictDepBuilds: true
blockExoticSubdeps: true
trustPolicy: no-downgrade

trustPolicyExclude:
  - 'semver@6.3.1'
  - 'tinyexec@1.2.2'

engineStrict: true
resolutionMode: time-based
strictPeerDependencies: true
verifyDepsBeforeRun: error

packages:
  - packages/*
  - apps/*

allowBuilds:
  esbuild: false

catalogs:
  storybook:
    storybook: 10.6.7
    '@storybook/addon-a11y': 10.6.7
    '@storybook/addon-docs': 10.6.7
    storybook-solidjs-vite: 10.7.4
  tsdown:
    '@tsdown/css': 0.23.5
    tsdown: 0.23.5
  vitest:
    'axe-core': 4.14.0
    playwright: 1.64.1
    vitest: 4.1.12
    '@vitest/browser-playwright': 4.1.12
    '@vitest/coverage-istanbul': 4.1.12
    '@vitest/coverage-v8': 4.1.12
  vite:
    vite: 8.3.8
    '@solidjs/vite-plugin': 3.0.0
  solid:
    solid-js: ^2.0.0
    '@solidjs/web': ^2.0.0
    '@solidjs/router': ^2.0.0
    '@solidjs/meta': ^2.0.0
  primitives:
    '@solid-primitives/focus': ^1.0.0
    '@solid-primitives/interaction': ^1.0.0
    '@solid-primitives/intersection-observer': ^3.0.0
    '@solid-primitives/media': ^4.0.0
    '@solid-primitives/mutation-observer': ^3.0.0
    '@solid-primitives/pointer': ^1.0.0
    '@solid-primitives/refs': ^3.0.0
    '@solid-primitives/resize-observer': ^4.0.0
    '@solid-primitives/scheduled': ^2.0.0
    '@solid-primitives/storage': ^5.0.0
    '@solid-primitives/transition-group': ^2.0.0
  testing:
    '@solidjs/testing-library': 1.0.0-rc.2

versioning:
  changelog:
    storage: repository
